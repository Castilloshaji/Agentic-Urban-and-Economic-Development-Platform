# Remote sources per raw-data category, for `ingest.py --url <category>`.
#
# NOT YET WIRED UP — --url currently raises NotImplementedError. This file is
# the intended shape of the download config; URLs below are the Phase 1 sources
# from docs/ernakulam_phase1_architecture.md section 2, Stage 1.
#
# Each entry:
#   name:      short slug, becomes the filename stem under data/raw/<category>/
#   url:       direct download URL
#   publisher: who publishes it (goes in data_dictionary.md)
#   year:      dataset vintage
#   notes:     access caveats, licence, manual steps

